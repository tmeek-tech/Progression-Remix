# Dev client only, never packaged (build.gradle points the dev Minecraft at it).
# Power Grid reads Level.getEntities() through a mixin accessor named getEntities. In the dev client, which runs with
# official names, that accessor is the protected method itself, so Power Grid throws IllegalAccessError the moment a
# world is joined. In a real game (SRG names) the accessor is a method of its own and nothing needs opening.
public net.minecraft.world.level.Level m_142646_()Lnet/minecraft/world/level/entity/LevelEntityGetter; # getEntities
public net.minecraft.client.multiplayer.ClientLevel m_142646_()Lnet/minecraft/world/level/entity/LevelEntityGetter; # getEntities
