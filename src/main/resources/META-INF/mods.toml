modLoader = "javafml"
loaderVersion = "[47,)"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_author}"
description = '''
${mod_description}
'''

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "[47.1.3,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "[1.20.1]"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "create"
mandatory = true
versionRange = "[6.0.7,6.1)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "ponder"
mandatory = true
versionRange = "[1.0,)"
ordering = "AFTER"
side = "BOTH"

# required since 0.14.0: aluminium needs a real circuit, and its motors, transformers and boards take steel and Bakelite.
# AFTER puts this mod's data pack over Power Grid's, so its recipe overrides win
[[dependencies.${mod_id}]]
modId = "powergrid"
mandatory = true
versionRange = "[0.6.2,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "immersive_weathering"
mandatory = false
# IW numbers its versions after Minecraft's (1.20.1-2.0.5), so a plain [2.0,) rejects every release and stops the game loading
versionRange = "[1.20.1-2.0,)"
ordering = "AFTER"
side = "BOTH"
